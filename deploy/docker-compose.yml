# 一键部署：Caddy（HTTPS 反代）+ Shiro 前端 + blog-server 后端
# 用法：cp .env.production.example .env && 编辑域名/密钥后 docker compose up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server

  # Shiro 前端（Next.js standalone，端口 2323）
  # networks 说明：服务器上 HTTPS 统一由 timbersage-caddy 反代（两台 caddy 不能同时
  # 抢 443），博客容器加入 timbersage_default 网络；Next standalone 按 HOSTNAME
  # 只绑主网络 IP，因此 timbersage_default 必须声明为主网络（aliases 列表第一位）
  web:
    build:
      context: ../Shiro
      dockerfile: Dockerfile
      args:
        # 同域反代：API 走相对路径，构建期即可确定
        BASE_URL: ''
    restart: unless-stopped
    environment:
      - PORT=2323
      # API 地址必须是带协议的绝对地址：首页等页面的聚合数据由 Next.js SSR 在
      # Node 端 fetch，相对路径会直接 Invalid URL。浏览器与 SSR 共用该地址，
      # 它与站点同源（经 Caddy 反代），不会引入 CORS。
      - NEXT_PUBLIC_API_URL=${WEB_URL}/api/v2
      - NEXT_PUBLIC_GATEWAY_URL=
    networks:
      timbersage_default:
        aliases:
          - deploy-web-1
    expose:
      - '2323'

  # 自建后端（NestJS + SQLite，端口 2333）
  server:
    build: ../blog-server
    restart: unless-stopped
    environment:
      - PORT=2333
      # 改成你的真实域名（用于 sitemap/RSS 里的绝对链接）
      - WEB_URL=${WEB_URL}
      # 必改：随机长字符串（node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"）
      - JWT_SECRET=${JWT_SECRET}
      # 可选：首次建站管理密码（不设则随机生成并打印在容器日志 docker logs）
      - SEED_OWNER_PASSWORD=${SEED_OWNER_PASSWORD}
      - OWNER_NAME=${OWNER_NAME}
    expose:
      - '2333'
    networks:
      timbersage_default:
        aliases:
          - deploy-server-1
    volumes:
      # SQLite 数据库与上传文件持久化
      - server_data:/app/prisma
      - server_uploads:/app/uploads

volumes:
  caddy_data:
  caddy_config:
  server_data:
  server_uploads:

# HTTPS 由 timbersage 项目的 caddy 统一反代（见各服务 networks 注释）。
# external: true 表示网络已存在（timbersage compose 创建），compose 不会新建
networks:
  timbersage_default:
    external: true
